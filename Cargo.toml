[package]
name = "advent_of_code"
version = "0.12.0"
authors = ["Steven Lotito <steven.lotito@gmail.com>"]
edition = "2024"
default-run = "advent_of_code"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
doctest = false

[profile.dhat]
inherits = "release"
debug = 1

[features]
dhat-heap = ["dhat"]
today = []
test_lib = []

[dependencies]

# Template dependencies
dhat = { version = "0.3.3", optional = true }
pico-args = "0.5.0"
tinyjson = "2.5.1"

# Solution dependencies
chrono = { version = "0.4"}
itertools = "0.15.0"
md5-many = "0.1.0-alpha.4"
md-5 = "0.11"
hex = "0.4.3"
rayon = "1.12.0"

[dev-dependencies]
rstest = "0.26"
